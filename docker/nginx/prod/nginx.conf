pid /tmp/nginx.pid;

# Tied to NGINX_CPUS: auto reads the host's core count, which cpus: does not shrink.
worker_processes     1;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # nginx creates all five at startup regardless of proxy_pass/uwsgi_pass/scgi_pass
    # being absent; the default /var/cache/nginx is not writable under read_only: true.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    server_tokens off;

    access_log /var/log/nginx/access.log;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Equal to post_max_size (zz-owasp-hardening.ini). Set higher and nginx accepts
    # the body, then PHP discards it and Laravel answers 419 on an empty request.
    client_max_body_size 25M;

    keepalive_timeout         30;
    keepalive_requests        1000;
    client_body_timeout       10;
    send_timeout              10;
    reset_timedout_connection on;

    open_file_cache          max=200000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip            on;
    gzip_static     on;
    gzip_min_length 10240;
    gzip_comp_level 1;
    gzip_vary       on;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # A request reaching FPM costs orders of magnitude more than a file nginx serves
    # itself, so static keeps its own ceiling instead of relaxing the app's.
    limit_req_zone  $binary_remote_addr zone=req_app:5m    rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=req_static:5m rate=100r/s;

    # Applied per HTTP/2 stream, not per connection; the first megabyte is unthrottled.
    limit_rate_after 1m;
    limit_rate       512k;

    # add_header does not accumulate across levels: a single add_header in any server
    # or location drops this whole block for it.
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-DNS-Prefetch-Control    "off" always;
    # Flip to "index, follow" for a publicly indexed site.
    add_header X-Robots-Tag              "noindex, nofollow" always;
    add_header Content-Security-Policy   "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "accelerometer=(),autoplay=(),camera=(),display-capture=(),document-domain=(),encrypted-media=(),fullscreen=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),midi=(),payment=(),picture-in-picture=(),publickey-credentials-get=(),screen-wake-lock=(),sync-xhr=(),usb=(),web-share=(),xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    server {
        listen 8081 default_server;
        server_name _;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl default_server;
        http2 on;

        # Single-app container: the certificate decides the name, and Laravel's
        # TrustedHost middleware rejects a mismatched Host.
        server_name _;

        root  /var/www/public;
        index index.php;

        # Mounted read-only; issuance is left to the deployment.
        ssl_certificate         /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key     /etc/nginx/tls/privkey.pem;
        ssl_trusted_certificate /etc/nginx/tls/chain.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_ecdh_curve            X25519MLKEM768:X25519:prime256v1:secp384r1;

        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_buffer_size     1400;

        client_body_buffer_size     128k;
        client_header_buffer_size   1k;
        large_client_header_buffers 4 8k;

        error_page 404 /index.php;

        location ^~ /build/ {
            limit_req  zone=req_static burst=200 nodelay;
            limit_conn conn_limit_per_ip 20;
            try_files  $uri =404;
        }

        location ^~ /images/ {
            limit_req  zone=req_static burst=200 nodelay;
            limit_conn conn_limit_per_ip 20;
            try_files  $uri =404;
        }

        location / {
            limit_req  zone=req_app burst=100 nodelay;
            limit_conn conn_limit_per_ip 20;
            try_files  $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Reachable only through try_files and error_page; a direct request 404s.
        location = /index.php {
            internal;

            include fastcgi_params;
            fastcgi_pass  php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_read_timeout 40s;
            fastcgi_hide_header X-Powered-By;
        }

        # 404 rather than deny's 403: a protected path answers like an absent one.
        location ~ /\.(?!well-known) {
            return 404;
        }
    }
}
