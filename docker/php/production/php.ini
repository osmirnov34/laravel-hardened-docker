date.timezone = Europe/Moscow

; Recommendation OWASP (https://cheatsheetseries.owasp.org/cheatsheets/PHP_Configuration_Cheat_Sheet.html)

; errors/logging
expose_php = Off
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
ignore_repeated_errors = Off
; error_log points to stdout/stderr (container convention) instead of a file path — collected by the container runtime's log driver
error_log = /proc/self/fd/2
html_errors = Off
zend.exception_ignore_args = On

; file upload handling
allow_url_fopen = Off

; restrict file system access
open_basedir = /var/www:/tmp
doc_root = /var/www/public

; hardening
allow_url_include = Off
allow_webdav_methods = Off
enable_dl = Off
cgi.fix_pathinfo = 0

; disable dangerous functions
; move_uploaded_file, mkdir, rmdir, chmod, rename and putenv are excluded from OWASP's list — Laravel needs them for
; storage/uploads handling and phpdotenv env loading
disable_functions = system, exec, shell_exec, passthru, phpinfo, show_source, highlight_file, popen, proc_open, fopen_with_path, dbmopen, dbase_open, chdir, filepro, filepro_rowcount, filepro_retrieve, posix_mkfifo
disable_classes =

; variables order
variables_order = "GPCS"

; sessions
session.save_path = /var/www/storage/framework/sessions
session.name = app_session_id
session.auto_start = Off
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_domain = full.qualified.domain.name
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.cache_expire = 30
session.gc_maxlifetime = 600
session.cookie_lifetime = 14400
session.sid_length = 256
session.sid_bits_per_character = 6

; resource limits
; memory_limit, post_max_size, upload_max_filesize and max_file_uploads are excluded from OWASP's recommended values
; (50M/20M/2M/2) — too tight for Laravel/artisan and typical app file uploads, would break normal operation
memory_limit = 256M
max_execution_time = 60
max_input_time = 30
post_max_size = 250M
upload_max_filesize = 20M
max_file_uploads = 10
report_memleaks = On
