; FPM pool hardening overlay for Laravel (production).
; zz- prefix loads last in php-fpm.d/, overriding the default www.conf pool.

[www]

; starting point — tune against container memory limit and load-test results
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

listen.backlog = 1024

request_terminate_timeout = 35s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; restrict at the reverse-proxy/ingress — not reachable from outside the cluster
pm.status_path = /status
ping.path = /ping
ping.response = pong

security.limit_extensions = .php

; all container env vars reach PHP workers; boundary enforced upstream (only inject what the app needs)
clear_env = no
