; OWASP hardening overlay for Laravel (production)
;
; Base: PHP's official php.ini-production (PHP 8.5) is copied to php.ini in the image.
;       https://github.com/php/php-src/blob/PHP-8.5/php.ini-production
; Files in conf.d/ load AFTER php.ini; the `zz-` prefix makes this one load last so it wins.
;
; For auditability EVERY security-relevant directive is stated explicitly below — even when the
; value already equals the vendor default — so this file is a complete, self-contained record of
; the hardened config and no security setting can be silently changed by a base-image bump:
;   ; base: <value>   the vendor default this line overrides
;   ; base: same      value pinned equal to the vendor default (defensive pin, no behaviour change)
;
; Every directive here is an OWASP PHP Configuration Cheat Sheet recommendation
;   https://cheatsheetseries.owasp.org/cheatsheets/PHP_Configuration_Cheat_Sheet.html
; except date.timezone and the resource limits, which are operational deviations (see README).

; operational
date.timezone = Europe/Moscow            ; base: unset

; PHP error handling
expose_php = Off                         ; base: On
error_reporting = E_ALL                  ; base: E_ALL & ~E_DEPRECATED
display_errors = Off                     ; base: same
display_startup_errors = Off             ; base: same
log_errors = On                          ; base: same
error_log = /proc/self/fd/2              ; base: unset — stdout/stderr (container convention)
ignore_repeated_errors  = Off            ; base: same

; PHP file upload handling
file_uploads = On                        ; base: same
upload_tmp_dir = /tmp/laravel-uploads    ; base: unset
upload_max_filesize = 20M                ; base: 2M
max_file_uploads = 10                    ; base: 20

; PHP executable handling
enable_dl = Off                          ; base: same
; OWASP's list also disables move_uploaded_file, mkdir, rmdir, chmod, rename, putenv — kept ENABLED
; here because Laravel needs them: file uploads (store()), Illuminate\Filesystem (storage + atomic
; config/route cache), phpdotenv (.env loading). chdir has no such need and stays disabled.
disable_functions = system, exec, shell_exec, passthru, phpinfo, show_source, highlight_file, popen, proc_open, fopen_with_path, dbmopen, dbase_open, chdir, filepro, filepro_rowcount, filepro_retrieve, posix_mkfifo  ; base: unset

; PHP session handling
; Laravel overrides these via config/session.php (cookie flags, lifetime, path, domain) and does
; not use the native session engine when SESSION_DRIVER is file/database/redis/cookie/array — this
; section is defense-in-depth for any code path that calls session_start() directly.
session.save_path                = /var/www/storage/framework/sessions  ; base: unset
session.name                     = sessid                               ; base: PHPSESSID
session.auto_start               = Off                                  ; base: same
session.use_trans_sid            = 0                                    ; base: same
session.cookie_domain            = full.qualified.domain.name           ; base: unset
session.cookie_path              = /                                    ; base: same
session.use_strict_mode          = 1                                    ; base: off
session.use_cookies              = 1                                    ; base: same
session.use_only_cookies         = 1                                    ; base: same
session.cookie_lifetime          = 14400                                ; base: 0
session.cookie_secure            = 1                                    ; base: unset
session.cookie_httponly          = 1                                    ; base: unset
session.cookie_samesite          = Strict                               ; base: unset
session.cache_expire             = 30                                   ; base: 180
; OWASP also recommends session.sid_length=256 / session.sid_bits_per_character=6, but PHP 8.4
; deprecated CHANGING both — setting them raises E_DEPRECATED. Omitted deliberately: the defaults
; (32 hex chars x 4 bits) already give 128 bits of entropy, meeting OWASP's session ID requirement.
