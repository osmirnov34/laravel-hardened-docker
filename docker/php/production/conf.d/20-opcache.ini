; OPcache overlay for Laravel (production) — performance, not security.
; Sources are the php.net manual (`; base:` = vendor default) and measurement (`; measured:`).
;   https://www.php.net/manual/en/opcache.configuration.php
; Requires docker-php-ext-install opcache, else inert.

opcache.enable                   = 1        ; base: same
opcache.enable_cli               = 0        ; base: same — worth 1 only in a worker overlay

; measure via opcache_get_status() on a warmed image, then replace these
opcache.memory_consumption       = 256      ; base: 128   ; measured: TBD
opcache.interned_strings_buffer  = 16       ; base: 8     ; measured: TBD — subtracted from the 256
opcache.max_accelerated_files    = 20000    ; base: 10000 ; measured: TBD — rounds up to 32531

; immutable image: code can't change at runtime, so timestamp checks buy nothing
opcache.validate_timestamps      = 0        ; base: 1
opcache.revalidate_freq          = 0        ; base: 2    — inert while validate_timestamps=0, pinned
opcache.max_wasted_percentage    = 5        ; base: same — inert likewise, pinned

opcache.save_comments             = 1        ; base: same — Laravel/PHPUnit need it

; DEVIATION from manual's "recommended for most users": Laravel is I/O-bound, JIT mainly adds
; attack surface here. `disable`, not `off` — off stays switchable via ini_set().
opcache.jit                      = disable  ; base: same (tracing before PHP 8.4)
opcache.jit_buffer_size          = 0        ; base: 64M

opcache.huge_code_pages          = 0        ; base: same — depends on host THP

; --- security-relevant directives ---

opcache.restrict_api             = /nonexistent/opcache-api  ; base: "" — blocks opcache_reset() etc.

; file_cache: left unset, writable cache dir = code execution on read-back
; preload / preload_user: left unset, runs at FPM startup as preload_user — opt in per project

opcache.validate_permission      = 0        ; base: same — single-user container
opcache.validate_root            = 0        ; base: same — only relevant if chroot'ed