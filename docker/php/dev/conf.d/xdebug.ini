; Off unless XDEBUG_MODE says otherwise — the env var overrides this line. Left
; on, xdebug reaches for an IDE on every request and stalls when none answers.
xdebug.mode = off

; trigger, not yes: only requests carrying XDEBUG_TRIGGER (or the browser
; extension's cookie) start a session.
xdebug.start_with_request = trigger

; Needs `extra_hosts: ["host.docker.internal:host-gateway"]` on Linux; the name
; resolves on its own only on Docker Desktop.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
