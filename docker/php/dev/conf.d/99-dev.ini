; Development overlay on php.ini-development. Deliberately the opposite of
; production wherever a value would hide a fault instead of surfacing it.
;
; production/conf.d/zz-owasp-hardening.ini is NOT copied into this stage:
; it disables proc_open, which composer and several artisan commands need.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; Production pins this to 0 — an immutable image cannot change under it. Here
; the source is bind-mounted, so opcache must re-stat or edits never take effect.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; A breakpoint holds the request open for as long as you look at it.
max_execution_time = 0
memory_limit = 512M
