; Dev pool. Loaded after www.conf; the zz- prefix is what orders it last.

[www]
; One developer, one request at a time — but each idle worker holds an
; xdebug-enabled interpreter, so keep the floor low.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Production sets 35s. Here any timeout kills the worker while it sits on a
; breakpoint.
request_terminate_timeout = 0

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no
